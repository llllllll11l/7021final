[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gsm8k-lora"
version = "0.1.0"
description = "Budget-matched LoRA experiments with random and moderate-loss selection on GSM8K"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = [
    "torch==2.9.1",
    "transformers==4.57.3",
    "peft==0.18.0",
    "trl==0.27.0",
    "datasets==4.4.1",
    "accelerate==1.12.0",
    "huggingface-hub==0.36.2",
]
notebook = [
    "huggingface-hub==0.36.2",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "matplotlib>=3.8,<4",
]
hub = ["huggingface-hub==0.36.2"]

[project.scripts]
gsm8k-prepare = "gsm8k_lora.prepare:main"
gsm8k-select = "gsm8k_lora.select_data:main"
gsm8k-run = "gsm8k_lora.run:main"
gsm8k-summarize = "gsm8k_lora.summarize:main"
gsm8k-reproduce = "gsm8k_lora.reproduce:main"
gsm8k-artifacts = "gsm8k_lora.artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]
